<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Tabele</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 36px;
      color: #212;
    }


    table {
      border-collapse: collapse;
      table-layout: fixed;
      margin: 31px;
      width: 500px;
    }

    th, td {
      border: 1px solid #555;
      width: 8px;
      height: 58px;
      text-align: center;
      vertical-align: middle;
    }

    th {
      background: #c0e9f8;
      font-weight: 400;
      height: 36px;
    }

    th:first-child {
      width: 2px;
    }

    .col0 {
      background: #eaf2dd;
    }

    .col1 {
      background: #d7e3bd;
    }

    .col2 {
      background: #c2d69b;
    }
    </style>
  </head>
  <body>
    <table>
      <tr>
	<th>1</th> <th>2</th> <th>3</th> <th>4</th> <th>5</th> <th>6</th>
      </tr>
      <tr>
	<th>2</th> <td>a</td> <td >b</td ><td >c</td> <td>d</td> <td>e</td>
      </tr>
      <tr>
	<th>3</th> <td>f</td> <td>g</td> <td>h</td> <td>i</td> <td >j</td>
      </tr>
      <tr>
	<th>4</th> <td>k</td> <td>l</td> <td>m</td> <td>n</td> <td >o</td>
      </tr>
      <tr>
	<th>5</th> <td >p</td> <td >q</td> <td >r</td> <td>s</td> <td>t</td>
      </tr>
      <tr>
	<th>6</th> <td >u</td> <td >v</td> <td >w</td> <td>y</td> <td>z</td>
      </tr>
    </table>

    <table>
      <tr>
	<th>1</th> <th>2</th> <th>3</th> <th>4</th> <th>5</th> <th>6</th>
      </tr>
      <tr>
	<th>2</th> <td>a</td> <td >b</td ><td >c</td> <td>d</td> <td>e</td>
      </tr>
      <tr>
	<th>3</th> <td>f</td>  <td class="col0" colspan="2" rowspan="2">m, g</td> <td>i</td> <td >j</td>
      </tr>
      <tr>
	<th>4</th> <td>k</td> <td>n</td> <td >o</td>
      </tr>
      <tr>
	<th>5</th> <td >p</td> <td >q</td> <td >r</td> <td>s</td> <td>t</td>
      </tr>
      <tr>
	<th>6</th> <td >u</td> <td >v</td> <td >w</td> <td>y</td> <td>z</td>
      </tr>
    </table>

  </body>
</html>
